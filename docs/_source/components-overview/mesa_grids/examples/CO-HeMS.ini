; Example: CO-HeMS grid.
; A compact object and a helium star, built from formation steps
; (the release defines them; no ZAMS model is needed).
; Set up with: posydon-grid setup CO-HeMS.ini
; Paths are relative to this file. For every option of this grid type:
;   posydon-grid init CO-HeMS full.ini

[grid]
type = CO-HeMS
mode = fixed
; one row per run; columns: initial_z, Zbase, m1, m2, initial_period_in_days
points = grid.csv
run_directory = run

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model
star2 = none
binary = history

[submission]
backend = slurm_array       ; one array task per grid point
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
cpus_per_task = 4
