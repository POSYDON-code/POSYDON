; Example: HeMS-HMS grid.
; A helium star from formation steps and a hydrogen-rich star from ZAMS.
; Set up with: posydon-grid setup HeMS-HMS.ini
; Paths are relative to this file. For every option of this grid type:
;   posydon-grid init HeMS-HMS full.ini

[grid]
type = HeMS-HMS
mode = fixed
; one row per run; columns: initial_z, Zbase, m1, m2, initial_period_in_days
points = grid.csv
run_directory = run
; only star 2 starts from a ZAMS model; star 1 is formed
zams_star2 = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model
star2 = history, final_model
binary = history

[submission]
backend = slurm_array       ; one array task per grid point
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
cpus_per_task = 4
