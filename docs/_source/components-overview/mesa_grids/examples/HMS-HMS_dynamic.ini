; Example: dynamic HMS-HMS grid: psy-cris picks the points while it runs.
; Set up with: posydon-grid setup HMS-HMS_dynamic.ini

[grid]
type = HMS-HMS
mode = dynamic
points = grid.csv           ; the starting points
psycris_inifile = psycris.ini  ; the sampling settings of psy-cris
run_directory = run
zams = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model
star2 = history, final_model
binary = history

[submission]
; a dynamic grid runs as one MPI job: psy-cris samples on rank 0
backend = slurm_mpi
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
nodes = 2
mpi_tasks = 16              ; MPI tasks per node
cpus_per_task = 4
