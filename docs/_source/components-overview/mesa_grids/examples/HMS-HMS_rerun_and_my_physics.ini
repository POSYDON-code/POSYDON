; Example: HMS-HMS grid with a rerun of v2.0 and your own physics on top.
; Set up with: posydon-grid setup HMS-HMS_rerun_and_my_physics.ini
; Check first where every value comes from:
;   posydon-grid explain HMS-HMS_rerun_and_my_physics.ini

[grid]
type = HMS-HMS
mode = fixed
points = grid.csv
run_directory = run
zams = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
release = v2.0
; a physics variant of v2.0: r11701/releases/v2.0/reruns/<rerun>/
rerun = matthias_lbv_thermo_dedt_noAgeLimit
inlist_repo = ~/POSYDON-MESA-INLISTS

[user_inlists]
; your own MESA inlists, on top of the release, key by key: they only
; change the keys they set (in &controls / &star_job / &binary_*)
binary = my_inlist_project            ; &binary_controls, &binary_job
star1 = my_inlist1                     ; star 1's &controls, &star_job
star2_controls = my_inlist2_controls   ; only star 2's &controls
; whole files replace the release's
run_star_extras = my_run_star_extras.f ; every star
history_columns = my_history_columns.list

[output]
history_interval = 1
star1 = history, final_model
star2 = history, final_model
binary = history

[submission]
backend = slurm_array       ; one array task per grid point
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
cpus_per_task = 4
