; Example: single_HMS grid.
; Single hydrogen-rich stars from ZAMS.
; Set up with: posydon-grid setup single_HMS.ini
; Paths are relative to this file. For every option of this grid type:
;   posydon-grid init single_HMS full.ini

[grid]
type = single_HMS
mode = fixed
; one row per run; columns: initial_z, Zbase, initial_mass
points = grid.csv
run_directory = run
zams_star1 = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model  ; written by the step that runs the star

[submission]
backend = slurm_array       ; one array task per grid point
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
cpus_per_task = 4
