; Example: CO-HMS_RLO grid.
; A compact object (a point mass) and a hydrogen-rich star from ZAMS.
; Set up with: posydon-grid setup CO-HMS_RLO.ini
; Paths are relative to this file. For every option of this grid type:
;   posydon-grid init CO-HMS_RLO full.ini

[grid]
type = CO-HMS_RLO
mode = fixed
; one row per run; columns: initial_z, Zbase, m1, m2, initial_period_in_days
points = grid.csv
run_directory = run
zams_star1 = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model
star2 = none  ; a point mass: nothing to write
binary = history

[submission]
backend = slurm_array       ; one array task per grid point
partition = <partition>
account = <account>
walltime = 2-00:00:00
email = <email>
cpus_per_task = 4
