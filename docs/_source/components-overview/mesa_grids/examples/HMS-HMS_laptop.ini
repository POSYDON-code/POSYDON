; Example: a few HMS-HMS points on a laptop or workstation, no SLURM.
; Set up with: posydon-grid setup HMS-HMS_laptop.ini
; then run them: ./run/grid_command.sh

[grid]
type = HMS-HMS
mode = fixed
points = grid.csv
run_directory = run
zams = ~/POSYDON-MESA-INLISTS/r11701/ZAMS_models/zams_z1.42m2_y0.2703.data

[scenario]
; the v2.0 physics, read from your clone of POSYDON-MESA-INLISTS (branch
; v2_sources) as it is; keep it up to date yourself (git pull)
release = v2.0
inlist_repo = ~/POSYDON-MESA-INLISTS

[output]
history_interval = 1
star1 = history, final_model
star2 = history, final_model
binary = history

[submission]
; a shell script that runs the points one after another
backend = shell
job_array = true
cpus_per_task = 4           ; OpenMP threads of each MESA run
