# Example POSYDON population inifile with a custom flow and a custom CE step.
#
# This file is stacked on top of the default inifile
# ($PATH_TO_POSYDON/posydon/popsyn/population_params_default.ini), so it only
# lists what differs from the defaults. Every other setting keeps its default
# value.

[flow]
  import = None
    # builtin posydon flow
  absolute_import = ['custom_step_and_flow.py', 'end_flow_chart']
    # If given, use an absolute filepath to user defined flow: ['<PATH_TO_PY_FILE>', '<NAME>']

[step_CE]
  import = None
    # builtin posydon step
  absolute_import = ['custom_step_and_flow.py', 'my_CE_step']
    # If given, use an absolute filepath to user defined step: ['<PATH_TO_PY_FILE>', '<NAME>']
    # Because this changes the class used for step_CE, the default [step_CE]
    # settings are not used. Only the settings below are passed to my_CE_step.
  verbose = False
