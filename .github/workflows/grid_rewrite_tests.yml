name: Grid setup rewrite baseline

# Temporary: runs grid_rewrite_tests/ while posydon-setup-grid is rewritten.
# Delete together with grid_rewrite_tests/ once the rewrite has landed.

on:
  push:
    branches:
      # the base branch and its siblings, e.g. ..._pr2 (git cannot hold
      # branches below an existing branch name)
      - 'enhancement/rewrite_mesa_grids'
      - 'enhancement/rewrite_mesa_grids_*'
  pull_request:
    paths:
      - 'bin/posydon-setup-grid'
      - 'bin/posydon-run-grid'
      - 'posydon/grids/setup/**'
      - 'grid_rewrite_tests/**'
      - '.github/workflows/grid_rewrite_tests.yml'
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ['3.11']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install POSYDON with test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]

    - name: Run the grid setup baseline tests
      run: pytest grid_rewrite_tests
